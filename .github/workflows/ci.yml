name: CI

on:
  # Push тільки в master: для гілок з PR достатньо запуску за pull_request,
  # інакше кожна перевірка виконувалась би двічі (push + PR).
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

# Новий коміт у гілку скасовує застарілий запуск цієї ж гілки; запуски master не скасовуються.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  # Статичний аналіз коду. Іде паралельно з build-test і має власний статус у PR: "Lint".
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore MiniEshop.slnx

      # Форматування та стиль за правилами з .editorconfig. Є порушення -> крок падає.
      - name: Code style and formatting (dotnet format)
        run: dotnet format MiniEshop.slnx --verify-no-changes --severity warn --no-restore

      # Аналізатори Roslyn (правила CA) і будь-які попередження компілятора вважаються помилками.
      - name: Static analysis (Roslyn analyzers)
        run: >
          dotnet build MiniEshop.slnx -c Release --no-restore
          -p:AnalysisMode=Recommended
          -p:TreatWarningsAsErrors=true

  build-test:
    name: "Build & Test (${{ matrix.service }})"
    runs-on: ubuntu-latest
    strategy:
      # Падіння одного сервісу не скасовує решту: вони незалежні.
      fail-fast: false
      matrix:
        service: [Catalog.Api, Orders.Api, Notifications.Api, Reviews.Api, Gateway]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Ключ залежить від усіх .csproj: змінився список пакетів -> кеш оновиться.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore tests/${{ matrix.service }}.Tests/${{ matrix.service }}.Tests.csproj

      - name: Build
        run: dotnet build src/${{ matrix.service }}/${{ matrix.service }}.csproj -c Release --no-restore

      - name: Test
        run: dotnet test tests/${{ matrix.service }}.Tests/${{ matrix.service }}.Tests.csproj -c Release --no-restore

  # Збірка Docker-образів. Стартує лише після успіху ВСІХ копій lint і build-test (needs);
  # якщо хоч одна впала, цей job пропускається.
  images:
    name: "Image (${{ matrix.image }})"
    needs: [lint, build-test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: catalog-api
            dockerfile: src/Catalog.Api/Dockerfile
          - image: orders-api
            dockerfile: src/Orders.Api/Dockerfile
          - image: notifications-api
            dockerfile: src/Notifications.Api/Dockerfile
          - image: reviews-api
            dockerfile: src/Reviews.Api/Dockerfile
          - image: gateway
            dockerfile: src/Gateway/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Образ збирається лише в межах раннера: push: false, публікації немає.
      # load: true кладе готовий образ у локальний Docker, щоб сканер міг його прочитати.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: mini-eshop-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # Блокуючий крок: знайдено HIGH/CRITICAL вразливість з наявним виправленням -> job падає.
      # Дія закріплена за хешем коміту (тег можна переставити, хеш ні).
      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mini-eshop-${{ matrix.image }}:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
