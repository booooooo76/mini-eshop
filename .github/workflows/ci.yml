name: CI

on:
  # Push тільки в master: для гілок з PR достатньо запуску за pull_request,
  # інакше кожна перевірка виконувалась би двічі (push + PR).
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

# Новий коміт у гілку скасовує застарілий запуск цієї ж гілки; запуски master не скасовуються.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build-test:
    name: "Build & Test (${{ matrix.service }})"
    runs-on: ubuntu-latest
    strategy:
      # Падіння одного сервісу не скасовує решту: вони незалежні.
      fail-fast: false
      matrix:
        service: [Catalog.Api, Orders.Api, Notifications.Api, Reviews.Api, Gateway]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Ключ залежить від усіх .csproj: змінився список пакетів -> кеш оновиться.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore tests/${{ matrix.service }}.Tests/${{ matrix.service }}.Tests.csproj

      - name: Build
        run: dotnet build src/${{ matrix.service }}/${{ matrix.service }}.csproj -c Release --no-restore

      - name: Test
        run: dotnet test tests/${{ matrix.service }}.Tests/${{ matrix.service }}.Tests.csproj -c Release --no-restore
