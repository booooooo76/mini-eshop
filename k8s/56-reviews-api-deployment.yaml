apiVersion: apps/v1
kind: Deployment
metadata:
  name: reviews-api
  namespace: mini-eshop
  labels:
    app: reviews-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: reviews-api
  template:
    metadata:
      labels:
        app: reviews-api
    spec:
      initContainers:
        - name: wait-for-deps
          image: busybox:1.37.0
          command:
            - sh
            - -c
            - |
              for target in postgres:5432; do
                host=${target%%:*}
                port=${target##*:}
                until nc -z "$host" "$port"; do
                  echo "waiting for $host:$port"
                  sleep 2
                done
              done
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 16Mi
      containers:
        - name: reviews-api
          image: ghcr.io/booooooo76/mini-eshop-reviews-api:1.0.0
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: eshop-config
          env:
            - name: ConnectionStrings__Reviews
              valueFrom:
                secretKeyRef:
                  name: eshop-secrets
                  key: ConnectionStrings__Reviews
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # Пауза перед зупинкою: ingress ще кілька секунд шле запити на под, який уже видаляється.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
