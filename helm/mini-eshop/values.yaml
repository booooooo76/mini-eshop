nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/booooooo76/mini-eshop
  tag: ""
  pullPolicy: IfNotPresent

config:
  environment: Development
  logLevel: Information

secrets:
  postgresUser: postgres
  postgresPassword: ""

app:
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  service:
    type: ClusterIP
    port: 8080
  preStopSleepSeconds: 10

waitForDeps:
  image:
    repository: busybox
    tag: "1.37.0"
  resources:
    requests:
      cpu: 10m
      memory: 8Mi
    limits:
      cpu: 50m
      memory: 16Mi

postgres:
  replicas: 1
  image:
    repository: postgres
    tag: 16-alpine
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""

rabbitmq:
  replicas: 1
  image:
    repository: rabbitmq
    tag: 3-management-alpine
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""

redis:
  replicas: 1
  image:
    repository: redis
    tag: 7-alpine
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

ingress:
  enabled: false
  className: nginx
  host: ""

hooks:
  preUpgradeCheck:
    enabled: true

tests:
  enabled: true
