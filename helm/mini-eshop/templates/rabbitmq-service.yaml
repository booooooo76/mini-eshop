{{- $fullname := include "mini-eshop.fullname" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-rabbitmq
  labels:
    {{- include "mini-eshop.labels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq
spec:
  type: ClusterIP
  selector:
    {{- include "mini-eshop.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
    - name: management
      port: 15672
      targetPort: management
