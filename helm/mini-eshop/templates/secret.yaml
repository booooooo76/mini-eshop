{{- $fullname := include "mini-eshop.fullname" . }}
{{- $user := .Values.secrets.postgresUser }}
{{- $password := required "secrets.postgresPassword is required: pass it with --set secrets.postgresPassword=..." .Values.secrets.postgresPassword }}
{{- $host := printf "%s-postgres" $fullname }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-secrets
  labels:
    {{- include "mini-eshop.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ $user | quote }}
  POSTGRES_PASSWORD: {{ $password | quote }}
  ConnectionStrings__Catalog: {{ printf "Host=%s;Port=5432;Database=catalog_db;Username=%s;Password=%s" $host $user $password | quote }}
  ConnectionStrings__Orders: {{ printf "Host=%s;Port=5432;Database=orders_db;Username=%s;Password=%s" $host $user $password | quote }}
  ConnectionStrings__Notifications: {{ printf "Host=%s;Port=5432;Database=notifications_db;Username=%s;Password=%s" $host $user $password | quote }}
  ConnectionStrings__Reviews: {{ printf "Host=%s;Port=5432;Database=reviews_db;Username=%s;Password=%s" $host $user $password | quote }}
