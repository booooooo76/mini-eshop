{{- $fullname := include "mini-eshop.fullname" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-reviews-api
  labels:
    {{- include "mini-eshop.labels" . | nindent 4 }}
    app.kubernetes.io/component: reviews-api
spec:
  replicas: {{ .Values.app.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "mini-eshop.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: reviews-api
  template:
    metadata:
      labels:
        {{- include "mini-eshop.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: reviews-api
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-config.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      initContainers:
        {{- include "mini-eshop.waitForDeps" (dict "root" . "targets" (list "postgres:5432")) | nindent 8 }}
      containers:
        - name: reviews-api
          image: {{ include "mini-eshop.appImage" (dict "root" . "service" "reviews-api") | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ $fullname }}-config
          env:
            - name: ConnectionStrings__Reviews
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}-secrets
                  key: ConnectionStrings__Reviews
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
          lifecycle:
            preStop:
              exec:
                command: ["sleep", {{ .Values.app.preStopSleepSeconds | quote }}]
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
